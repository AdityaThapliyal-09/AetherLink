name: aetherlink
description: "AetherLink: Decentralized Disaster Communication Network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # Cryptography (BouncyCastle port for Dart)
  pointycastle: ^3.9.1
  convert: ^3.1.1
  crypto: ^3.0.5

  # Unique identifiers
  uuid: ^4.4.2

  # Secure storage (Android Keystore backed)
  flutter_secure_storage: ^9.2.2

  # Formatting
  intl: ^0.20.1

  # Reactive streams
  rxdart: ^0.28.0

  # Value equality
  equatable: ^2.0.7
  
  # Permissions
  permission_handler: ^11.0.1

  # Google Fonts (Inter)
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
